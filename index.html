<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="shortcut icon" href="imagens/favicon.png" type="image/x-icon">
    <title>Mapa Unemat - Campus de Barra do Bugres</title>
    <!-- Chamando o leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous" />
    <link rel="stylesheet" href="estilos/style.css">
    <link rel="stylesheet" href="estilos/media-queries.css">


</head>


<body>


    <header>
        <a id="brasao" href="https://barradobugres.unemat.br/" aria-label="Ir para o site da UNEMAT — Campus de Barra do Bugres">
            <img src="imagens/brasao.png" alt="Brasão da UNEMAT" width="1123" height="1200">
        </a>

        <a id="logotipo" href="https://barradobugres.unemat.br/" aria-label="Ir para o site da UNEMAT — Campus de Barra do Bugres">
            <img src="imagens/logotipo-branco.png" alt="Logotipo da UNEMAT" width="1123" height="1200">
        </a>

    </header>
    
    <div class="barra-degrade" aria-hidden="true"></div>

    <main class="area-mapa">
        <div id="map"></div>
        <div class="pesquisa-locais">
            <button id="abrir-pesquisa" type="button" aria-label="Pesquisar salas" aria-expanded="false" aria-controls="painel-pesquisa">
                <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="10" cy="10" r="7"/><path d="m15 15 6 6"/></svg>
            </button>
            <div id="painel-pesquisa" hidden>
                <form id="form-pesquisa" role="search">
                    <input id="termo-pesquisa" type="search" placeholder="Pesquisar sala ou setor…" aria-label="Nome da sala ou setor" autocomplete="off">
                    <button type="submit">Buscar</button>
                </form>
                <p id="status-pesquisa" role="status"></p>
                <ul id="resultados-pesquisa" aria-label="Resultados da pesquisa"></ul>
            </div>
        </div>
        <aside id="painel-local" aria-label="Informações do local" hidden>
            <button id="fechar-painel-local" type="button" aria-label="Fechar informações">×</button>
            <div id="conteudo-painel-local"></div>
        </aside>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous"></script>
    <script src="js/script.js"></script>
</body>
</html>
